<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>우리 라이프 플랜 — 통합 대시보드</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <!--
    실행되는 스크립트(React·Tailwind·Firebase SDK)는 전부 vendor/에 자체 호스팅한다.
    부부의 재무 데이터를 다루는 앱이라 서드파티 CDN이 침해되면 그대로 탈취 경로가 되는데,
    Tailwind CDN은 런타임 컴파일러라 SRI를 걸 수 없어 무결성 검증이 불가능했다.
    같은 오리진에서 서빙하면 공급망이 배포 파이프라인 하나로 좁혀진다.
    버전 업은 dashboard/vendor/README.md의 명령으로 파일을 교체 → 커밋.
    폰트(CSS·woff2)는 JS를 실행하지 않으므로 CDN 유지 — 단 CSS에는 SRI를 건다.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- .min.css는 jsDelivr가 요청 시점에 생성(clean-css 버전에 따라 바이트가 바뀜)해서 SRI 해시가 깨져 폰트가 차단됐다.
       태그에 고정된 원본 pretendard.css는 불변이라 해시가 유지된다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
        integrity="sha384-SN6A48CJQjx946+DRb8wsoifC4a8ur9ZS6R+HCTgnBHOKCa6GLXAR3Qn8d1jztxg" crossorigin="anonymous" />
  <script src="./vendor/tailwind-3.4.17.min.js"></script>
  <!-- 인라인 <script>는 두지 않는다 — firebase.json의 CSP가 script-src 'self'(unsafe-inline 없음)라서 차단된다.
       설정·부트 스크립트는 tailwind-config.js / boot.js 파일로 분리했다. -->
  <script src="./tailwind-config.js"></script>
  <script src="./vendor/react-18.3.1.production.min.js"></script>
  <script src="./vendor/react-dom-18.3.1.production.min.js"></script>
  <script src="./vendor/firebase-app-compat-10.14.1.js"></script>
  <script src="./vendor/firebase-auth-compat-10.14.1.js"></script>
  <script src="./vendor/firebase-firestore-compat-10.14.1.js"></script>
  <script src="./vendor/firebase-messaging-compat-10.14.1.js"></script>
  <!-- firebase-config.js가 없으면 로컬 모드(로그인 없이 이 기기에만 저장)로 동작 -->
  <script src="./firebase-config.js"></script>
  <script src="./data/samples.js"></script>
  <style>
    /* 숫자 칸 스피너(▲▼) 숨김 — 금액은 직접 입력만 */
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield;appearance:textfield}
    .no-scrollbar::-webkit-scrollbar{display:none} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    body{background:#F4F4F5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
    /* 2열 그리드 — 좌→우, 위→아래 순서 배치. 홀수 개면 마지막 카드가 전폭을 채워 빈칸 없음 */
    .masonry{display:grid;grid-template-columns:1fr;gap:1.5rem;align-items:start}
    .masonry>*{min-width:0}
    /* 그리드 칸이 truncate 글자의 최소 폭만큼 늘어나 모바일 화면보다 넓어지던 문제(390px에서 454px) — 전역으로 막는다 */
    .grid>*{min-width:0}
    /* 키보드 포커스 표시 — 마우스 클릭엔 안 보이고 Tab 이동에만 */
    :focus-visible{outline:2px solid #0A0A0A;outline-offset:2px;border-radius:6px}
    /* 호버로만 보이던 삭제 버튼 등은 키보드 포커스 때도 보이게 */
    .group:focus-within .group-hover\:opacity-100{opacity:1}
    @media(min-width:1024px){
      .masonry{grid-template-columns:1fr 1fr}
      .masonry>*:last-child:nth-child(odd){grid-column:1/-1}
    }
    /* 금액 블러 모드 — 숫자 입력칸은 포커스하면 잠깐 보임 */
    .privacy-on input[type="number"]{filter:blur(5px)}
    .privacy-on input[type="number"]:focus{filter:none}
    .money-blur{filter:blur(5.5px);user-select:none;pointer-events:none;opacity:.85}
    /* 예전 서식 메모 표시 — Tailwind preflight가 지운 목록 스타일 복원 */
    .note-rich ul{list-style:disc;padding-left:1.3em;margin:.15em 0}
    .note-rich ol{list-style:decimal;padding-left:1.3em;margin:.15em 0}
    /* execCommand fontSize의 <font size> 절대 크기를 카드 본문(14px) 기준으로 재매핑 */
    .note-rich font[size="1"],.note-rich font[size="2"]{font-size:12px}
    .note-rich font[size="3"]{font-size:inherit}
    .note-rich font[size="4"]{font-size:16px}
    .note-rich font[size="5"],.note-rich font[size="6"],.note-rich font[size="7"]{font-size:19px}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./boot.js"></script>

  <script src="./policy.js"></script>
  <script src="./app.js"></script>
</body>
</html>
